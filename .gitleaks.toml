title = "En4tainment Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore known-safe files and placeholder values"
paths = [
  '''\.env\.example$''',
  '''package-lock\.json$''',
  '''node_modules/''',
  '''dist/''',
  '''build/''',
]

regexes = [
  '''your_supabase_url''',
  '''your_supabase_anon_key''',
  '''YOUR_SUPABASE_PROJECT_URL''',
  '''YOUR_SUPABASE_ANON_KEY''',
  '''MY_GEMINI_API_KEY''',
  '''MY_APP_URL''',
]

